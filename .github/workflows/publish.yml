name: Publish to npm

# Publishes the package when a v* tag is pushed (./release.sh pushes one), then creates the GitHub
# release with the zip and the version's CHANGELOG section. npm trusts this workflow (Trusted
# Publisher, set up on npmjs.com), so no token or one-time password is needed. The maintainer must
# create the GitHub Environment `npm` with a required reviewer; naming it below does not add approval.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release commit is not contained in origin/main"
            exit 1
          }

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $version"; exit 1; }

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: npm publish --provenance --access public

      - name: GitHub release with the zip
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash make-zip.sh
          zip="../$(basename "$PWD")-$version.zip"
          [ "$zip" = "../fast-ios-device-test-$version.zip" ] || mv "$zip" "../fast-ios-device-test-$version.zip"
          # This version's section of CHANGELOG.md, up to the next "## ".
          awk -v v="$version" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > /tmp/notes.md
          printf '\nInstall: `npx fast-ios-device-test`, or unzip this file and run its `install.sh`.\n' >> /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" "../fast-ios-device-test-$version.zip" --title "$version" --notes-file /tmp/notes.md
